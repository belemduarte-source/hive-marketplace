<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Static version of the animated nav honeycomb logo, tuned for 16-32px
       tab size: thicker, brighter cell strokes and a bigger cluster so the
       honeycomb still reads when tiny. -->
  <defs>
    <radialGradient id="hub" cx="50%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#fdba74"/>
      <stop offset="40%"  stop-color="#f97316"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </radialGradient>
    <linearGradient id="cell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#43200c"/>
      <stop offset="100%" stop-color="#2a1206"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0e1f3a"/>
  <g transform="translate(32,32) scale(1.28) translate(-32,-32)">
    <!-- 6 outer cells -->
    <polygon points="45,24.5 51.5,28.25 51.5,35.75 45,39.5 38.5,35.75 38.5,28.25" fill="url(#cell)" stroke="#fb923c" stroke-width="2.4"/>
    <polygon points="38.5,13.25 45,17 45,24.5 38.5,28.25 32,24.5 32,17" fill="url(#cell)" stroke="#fb923c" stroke-width="2.4"/>
    <polygon points="25.5,13.25 32,17 32,24.5 25.5,28.25 19,24.5 19,17" fill="url(#cell)" stroke="#fb923c" stroke-width="2.4"/>
    <polygon points="19,24.5 25.5,28.25 25.5,35.75 19,39.5 12.5,35.75 12.5,28.25" fill="url(#cell)" stroke="#fb923c" stroke-width="2.4"/>
    <polygon points="25.5,35.75 32,39.5 32,47 25.5,50.75 19,47 19,39.5" fill="url(#cell)" stroke="#fb923c" stroke-width="2.4"/>
    <polygon points="38.5,35.75 45,39.5 45,47 38.5,50.75 32,47 32,39.5" fill="url(#cell)" stroke="#fb923c" stroke-width="2.4"/>
    <!-- glowing centre hub -->
    <polygon points="32,24.5 38.5,28.25 38.5,35.75 32,39.5 25.5,35.75 25.5,28.25" fill="url(#hub)" stroke="#fdba74" stroke-width="1.4"/>
    <circle cx="32" cy="32" r="3" fill="#ffffff"/>
  </g>
</svg>
