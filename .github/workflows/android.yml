name: Android build

# Build a signed Android App Bundle (.aab) for Google Play. You can also build
# this locally on Windows in Android Studio — this workflow is for hands-off
# releases. Run it manually from the Actions tab; it produces an .aab artifact.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64     base64 of your upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD   keystore password
#   ANDROID_KEY_ALIAS           key alias (e.g. "hivex")
#   ANDROID_KEY_PASSWORD        key password

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps & generate the Android project
        working-directory: mobile
        run: |
          npm install
          npx cap add android || echo "android project already present"
          npx cap sync android

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode \
            > mobile/android/app/upload.jks

      - name: Build signed AAB
        working-directory: mobile/android
        env:
          KSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=app/upload.jks \
            -Pandroid.injected.signing.store.password="$KSTORE_PW" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PW"

      - name: Upload .aab artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hivex-android-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
