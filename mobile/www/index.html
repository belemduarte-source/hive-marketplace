<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Hivex</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #0a0f1a; color: #e2e8f0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 32px; gap: 18px;
      padding-top: max(32px, env(safe-area-inset-top));
      padding-bottom: max(32px, env(safe-area-inset-bottom));
    }
    .logo { font-size: 40px; font-weight: 900; letter-spacing: -1px; }
    .logo b { color: #f97316; }
    .spin {
      width: 38px; height: 38px; border-radius: 50%;
      border: 4px solid rgba(249,115,22,.25); border-top-color: #f97316;
      animation: s .9s linear infinite;
    }
    @keyframes s { to { transform: rotate(360deg); } }
    p { color: #94a3b8; font-size: 15px; max-width: 280px; line-height: 1.5; margin: 0; }
    button {
      margin-top: 8px; padding: 12px 22px; border: 0; border-radius: 10px;
      background: #f97316; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <!--
    This page is the bundled webDir fallback. Capacitor loads the live site
    (server.url = https://www.hivex.pt) on launch; this screen only appears
    briefly while that loads, or if the device is offline at launch.
  -->
  <div class="logo">Hi<b>v</b>ex</div>
  <div class="spin" id="spin"></div>
  <p id="msg">A ligar à Hivex…</p>
  <button id="retry" class="hidden" onclick="go()">Tentar novamente</button>
  <script>
    var SITE = 'https://www.hivex.pt';
    function go() {
      document.getElementById('retry').classList.add('hidden');
      document.getElementById('spin').classList.remove('hidden');
      document.getElementById('msg').textContent = 'A ligar à Hivex…';
      location.replace(SITE);
    }
    // If we're somehow still on the bundled page after a moment, offer a retry.
    setTimeout(function () {
      document.getElementById('spin').classList.add('hidden');
      document.getElementById('msg').textContent = 'Sem ligação à internet. Verifique a sua ligação e tente novamente.';
      document.getElementById('retry').classList.remove('hidden');
    }, 6000);
  </script>
</body>
</html>
